<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="origin" />
    <title></title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
    </style>
    <script>
      (() => {
        const appOrigin = "https://chapter-buildoff.vercel.app";
        const appId = "6a606ec9966ada5a7874da07";
        const params = new URLSearchParams(window.location.search);
        const accessToken = params.get("access_token");

        function safeReturnUrl() {
          try {
            const requested = new URL(params.get("return_url") || "/app", appOrigin);
            return requested.origin === appOrigin
              ? requested
              : new URL("/app", appOrigin);
          } catch {
            return new URL("/app", appOrigin);
          }
        }

        // Base44 derives the OAuth callback domain from the request referrer.
        // Start auth on this Base44-owned page so that domain is valid.
        if (window.location.pathname === "/oauth-start") {
          const returnUrl = new URL("/oauth-return", window.location.origin);
          returnUrl.searchParams.set("return_url", safeReturnUrl().toString());

          const loginUrl = new URL(
            "/api/apps/auth/login",
            "https://app.base44.com",
          );
          loginUrl.searchParams.set("app_id", appId);
          loginUrl.searchParams.set("from_url", returnUrl.toString());
          window.location.replace(loginUrl.toString());
          return;
        }

        // Base44 returns the token here; continue to the requested Vercel page.
        if (accessToken) {
          const destination = safeReturnUrl();

          if (window.opener && !window.opener.closed) {
            try {
              window.opener.postMessage(
                {
                  access_token: accessToken,
                  source: "chapter-bridge",
                  is_new_user: params.get("is_new_user"),
                },
                appOrigin,
              );
              window.close();
              return;
            } catch (e) {
              // fall through to redirect
            }
          }

          destination.searchParams.set("access_token", accessToken);
          const isNewUser = params.get("is_new_user");
          if (isNewUser != null) {
            destination.searchParams.set("is_new_user", isNewUser);
          }
          window.location.replace(destination.toString());
          return;
        }

        // Default: send people to the real product.
        const destination = new URL(
          window.location.pathname === "/" ? "/" : window.location.pathname,
          appOrigin,
        );
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body></body>
</html>
